[project]
name = "issueclaw"
version = "0.1.0"
description = "Mirror Linear into markdown files in git, and push your edits back. Issues as code for developers and AI agents."
readme = "README.md"
requires-python = ">=3.12"
license = "MIT"
license-files = ["LICENSE"]
authors = [
    { name = "Aviad Rozenhek" }
]
keywords = [
    "linear",
    "issues",
    "cli",
    "project-management",
    "sync",
    "issues-as-code",
    "markdown",
    "git",
    "ai-agents",
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.12",
    "Topic :: Software Development :: Bug Tracking",
]
dependencies = [
    "click>=8.3.2",
    "httpx>=0.28.1",
    "pydantic>=2.12.5",
    "python-dotenv>=1.2.2",
    "pyyaml>=6.0.3",
    "rich>=14.3.4",
    "tzdata>=2025.2",
]

[project.urls]
Homepage = "https://github.com/aviadr1/issueclaw"
Documentation = "https://github.com/aviadr1/issueclaw/tree/main/docs"
Repository = "https://github.com/aviadr1/issueclaw"
Issues = "https://github.com/aviadr1/issueclaw/issues"

[dependency-groups]
dev = [
    "basedpyright>=1.39.0",
    "pre-commit>=4.5.1",
    "pytest>=9.0.3",
    "pytest-cov>=7.1.0",
    "pytest-asyncio>=0.26.0",
    "pytest-xdist>=3.8.0",
    "ruff>=0.15.10",
]

[project.scripts]
issueclaw = "issueclaw.main:cli"
issueclaw-inbox-replay = "issueclaw.inbox_replay:main"
issueclaw-inbox-reconcile = "issueclaw.inbox_reconcile:main"

[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/issueclaw"]

# Ship only what builds the wheel. The test suite also checks this repo's own
# .github/workflows, so it only runs from a git checkout.
[tool.hatch.build.targets.sdist]
include = [
    "/src/issueclaw",
    "/README.md",
    "/LICENSE",
    "/pyproject.toml",
]

[tool.pytest.ini_options]
markers = [
    "slow: marks tests as slow (integration tests with real API calls)",
    "integration: marks tests as integration tests",
]
addopts = "--strict-markers -n auto"

[tool.basedpyright]
include = ["src", "tests"]
pythonVersion = "3.12"
typeCheckingMode = "standard"
