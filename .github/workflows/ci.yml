name: CI

on:
  workflow_dispatch:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  design-media-browser:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - uses: astral-sh/setup-uv@v6
      - run: uv sync --locked --dev --extra media
      - run: uv run playwright install --with-deps chromium
      - run: uv run pytest tests/test_design_media_browser.py -m browser -n 0 -q
  briefing-progress:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: '22'
      - run: npm ci --prefix tools/briefing-progress --ignore-scripts --no-audit --no-fund
      - run: node --test tests/briefing-progress.test.mjs
      - name: Exercise live artifact delivery
        uses: actions/github-script@v8
        with:
          script: |
            const {mkdtempSync} = require('node:fs');
            const {tmpdir} = require('node:os');
            const {join, resolve} = require('node:path');
            const {pathToFileURL} = require('node:url');
            process.env.BRIEFING_ARTIFACT_MODULE = resolve('tools/briefing-progress');
            const {supervise} = await import(pathToFileURL(resolve('src/issueclaw/briefing-progress.mjs')).href);
            const directory = mkdtempSync(join(tmpdir(), 'briefing-progress-ci-'));
            const result = await supervise(directory, [process.execPath, '-e', 'process.stdout.write("progress smoke test")']);
            if (result !== 0) core.setFailed('Progress supervisor did not preserve success');
  webhook-inbox:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: workers/issueclaw-webhook-proxy/package-lock.json
      - run: npm ci --ignore-scripts
        working-directory: workers/issueclaw-webhook-proxy
      - run: npm test
        working-directory: workers/issueclaw-webhook-proxy
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - uses: astral-sh/setup-uv@v6

      - name: Install dependencies
        run: uv sync --locked --dev

      - name: Ruff format check
        run: uv run ruff format --check .

      - name: Ruff lint
        run: uv run ruff check .

  types:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - uses: astral-sh/setup-uv@v6

      - name: Install dependencies
        run: uv sync --locked --dev --extra media

      - name: Basedpyright
        run: uv run basedpyright

  test-windows:
    # Not a required check. It keeps mirror paths POSIX on Windows, where
    # str(Path) produces backslashes and the mirror rejects them.
    runs-on: windows-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - uses: astral-sh/setup-uv@v6

      - name: Install dependencies
        run: uv sync --locked --dev

      - name: Run tests
        run: uv run pytest -q -n auto

  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - uses: astral-sh/setup-uv@v6

      - name: Install dependencies
        run: uv sync --locked --dev

      - name: Run tests
        run: |
          uv run pytest -q -n auto \
            --junitxml=artifacts/junit.xml \
            --cov=src \
            --cov-report=term-missing \
            --cov-report=xml:artifacts/coverage.xml \
            --cov-report=html:artifacts/htmlcov

      - name: Upload test and coverage artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-artifacts
          path: artifacts/

      - name: Upload coverage to Codecov
        if: always()
        uses: codecov/codecov-action@v5
        with:
          files: artifacts/coverage.xml
          fail_ci_if_error: false
          verbose: true

      - name: Coverage summary
        if: always()
        run: |
          python - <<'PY'
          import xml.etree.ElementTree as ET
          from pathlib import Path

          coverage_file = Path("artifacts/coverage.xml")
          if not coverage_file.exists():
              print("No coverage.xml produced")
              raise SystemExit(0)

          root = ET.parse(coverage_file).getroot()
          line_rate = float(root.attrib.get("line-rate", 0.0)) * 100
          branch_rate = float(root.attrib.get("branch-rate", 0.0)) * 100

          summary = Path("$GITHUB_STEP_SUMMARY")
          with summary.open("a", encoding="utf-8") as f:
              f.write("## Test Coverage\n")
              f.write(f"- Line coverage: {line_rate:.2f}%\n")
              f.write(f"- Branch coverage: {branch_rate:.2f}%\n")
              f.write("- Artifacts: `junit.xml`, `coverage.xml`, `htmlcov/`\n")
          PY
