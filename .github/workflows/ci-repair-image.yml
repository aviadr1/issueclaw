name: Build CI repair runner
on:
  pull_request:
    paths: ['docker/ci-repair/**', 'src/issueclaw/ci_repair*', '.github/workflows/ci-repair-image.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: docker/setup-buildx-action@v3
      - uses: docker/build-push-action@v6
        with:
          context: .
          file: docker/ci-repair/Dockerfile
          load: true
          push: false
          tags: ci-repair:test
      - name: Check toolchain and generic tests on Python 3.14
        run: |
          docker run --rm ci-repair:test bash -lc 'python --version; claude --version; gh --version; node --version; bun --version; uv --version'
          docker run --rm -v "$PWD:/repo:ro" -w /repo ci-repair:test bash -lc 'pip install pytest && pytest -o addopts= -q tests/test_ci_repair.py'
