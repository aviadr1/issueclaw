name: Publish an approved briefing preview
on:
  workflow_call:
    inputs:
      source-run-id:
        type: string
        required: true
      source-sha:
        type: string
        required: true
      tooling-ref:
        type: string
        required: true
      config:
        type: string
        required: true
    secrets:
      SLACK_BOT_TOKEN:
        required: true
permissions:
  contents: write
  actions: read
jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: actions/checkout@v6
        with:
          repository: aviadr1/issueclaw
          ref: ${{ inputs.tooling-ref }}
          path: .briefing-tools
          persist-credentials: false
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - uses: astral-sh/setup-uv@v6
      - name: Verify the approved source run
        env:
          GH_TOKEN: ${{ github.token }}
          SOURCE_RUN_ID: ${{ inputs.source-run-id }}
          SOURCE_SHA: ${{ inputs.source-sha }}
        run: |
          gh api "repos/$GITHUB_REPOSITORY/actions/runs/$SOURCE_RUN_ID" > /tmp/source-run.json
          python - <<'PY'
          import json, os
          from pathlib import Path
          run = json.loads(Path('/tmp/source-run.json').read_text())
          assert run['conclusion'] == 'success', 'Source preview did not succeed'
          assert run['head_sha'] == os.environ['SOURCE_SHA'], 'Unexpected preview commit'
          assert run['head_branch'] == 'main', 'Expected a preview from main'
          print('Approved preview run verified')
          PY
      - uses: actions/download-artifact@v6
        with:
          name: daily-learning-briefing
          path: /tmp/daily-briefing/
          run-id: ${{ inputs.source-run-id }}
          github-token: ${{ github.token }}
      - uses: actions/download-artifact@v6
        with:
          name: daily-learning-media
          path: /tmp/daily-briefing/
          run-id: ${{ inputs.source-run-id }}
          github-token: ${{ github.token }}
      - name: Publish the reviewed report and videos to Slack
        env:
          GITHUB_TOKEN: ${{ github.token }}
          SLACK_BOT_TOKEN: ${{ secrets.SLACK_BOT_TOKEN }}
          BRIEFING_CONFIG: ${{ inputs.config }}
        run: |
          uv venv /tmp/briefing-venv
          uv pip install --python /tmp/briefing-venv/bin/python ./.briefing-tools
          /tmp/briefing-venv/bin/python -m issueclaw.daily_briefing publish             --config "$BRIEFING_CONFIG" --out /tmp/daily-briefing
      - name: Preserve delivery receipts
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: frontend-briefing-delivery
          path: /tmp/daily-briefing/*state.json
          retention-days: 90
          if-no-files-found: warn
