# Publish issueclaw to PyPI with trusted publishing (no API token).
#
# The tag must match [project].version in pyproject.toml (v0.1.0 -> 0.1.0).
# Configure the PyPI trusted publisher before pushing the first tag:
#   owner: aviadr1
#   repository: issueclaw
#   workflow: publish.yml
#   environment: pypi

name: Publish to PyPI

on:
  push:
    tags:
      - "v*.*.*"

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - uses: astral-sh/setup-uv@v6

      - name: Verify tag matches project version
        run: |
          python - <<'PY'
          import os
          import tomllib
          from pathlib import Path

          tag = os.environ["GITHUB_REF_NAME"].removeprefix("v")
          version = tomllib.loads(Path("pyproject.toml").read_text())["project"]["version"]
          if tag != version:
              raise SystemExit(
                  f"Tag v{tag} does not match pyproject version {version}"
              )
          PY

      - name: Build sdist and wheel
        run: uv build

      - uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/

  publish:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/project/issueclaw/
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist/

      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1
