# Reusable opt-in consumer. Caller must share linear-git-sync with all writers.
name: Replay durable Linear inbox
on:
  workflow_call:
    inputs:
      issueclaw_ref:
        required: true
        type: string
      reconcile:
        type: boolean
        default: false
    secrets:
      LINEAR_API_KEY:
        required: true
      INBOX_URL:
        required: true
      INBOX_TOKEN:
        required: true
permissions:
  contents: write
jobs:
  replay:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Validate replay configuration before checkout
        env:
          LINEAR_API_KEY: ${{ secrets.LINEAR_API_KEY }}
          INBOX_URL: ${{ secrets.INBOX_URL }}
          INBOX_TOKEN: ${{ secrets.INBOX_TOKEN }}
          ISSUECLAW_REF: ${{ inputs.issueclaw_ref }}
        run: |
          python3 - <<'PY'
          import os
          import re
          import time
          from urllib.parse import urlsplit

          # Reject configuration failures before checkout or installation costs.
          for key in ("LINEAR_API_KEY", "INBOX_URL", "INBOX_TOKEN"):
              if not os.environ.get(key, "").strip():
                  raise SystemExit(f"::error::Missing required configuration: {key}")
          try:
              value = os.environ["INBOX_URL"]
              url = urlsplit(value)
              valid = (url.scheme == "https" and url.hostname
                       and not url.username and not url.password
                       and not url.query and not url.fragment
                       and not any(c.isspace() for c in value))
          except ValueError:
              valid = False
          if not valid:
              raise SystemExit("::error::INBOX_URL must be an HTTPS base URL without credentials, query or fragment")
          if not re.fullmatch(r"[0-9a-f]{40}", os.environ.get("ISSUECLAW_REF", "")):
              raise SystemExit("::error::ISSUECLAW_REF must be a full commit SHA")
          # One deadline across setup, discovery and replay. Leave 30 seconds
          # for runner startup/cleanup; replay reserves another 60 for publish/ACK.
          with open(os.environ["GITHUB_ENV"], "a") as handle:
              handle.write(f"ISSUECLAW_JOB_DEADLINE={time.time() + 270}\n")
          PY
      - uses: actions/checkout@v6
        with:
          ref: main
          fetch-depth: 1
          sparse-checkout: .sync
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - uses: astral-sh/setup-uv@v6
      - name: Install pinned replay runtime
        env:
          ISSUECLAW_REF: ${{ inputs.issueclaw_ref }}
        run: |
          [[ "$ISSUECLAW_REF" =~ ^[0-9a-f]{40}$ ]] || exit 1
          uv tool install "git+https://github.com/aviadr1/issueclaw.git@$ISSUECLAW_REF"
      - name: Discover missed changes using bounded metadata queries
        if: inputs.reconcile
        id: discovery
        env:
          LINEAR_API_KEY: ${{ secrets.LINEAR_API_KEY }}
          INBOX_URL: ${{ secrets.INBOX_URL }}
          INBOX_TOKEN: ${{ secrets.INBOX_TOKEN }}
        run: issueclaw-inbox-reconcile
      - name: Materialize mirrored content only when work exists
        if: ${{ !inputs.reconcile || steps.discovery.outputs.pending == 'true' }}
        run: git sparse-checkout set .sync linear
      - name: Replay and publish before acknowledgement
        if: ${{ !inputs.reconcile || steps.discovery.outputs.pending == 'true' }}
        env:
          LINEAR_API_KEY: ${{ secrets.LINEAR_API_KEY }}
          INBOX_URL: ${{ secrets.INBOX_URL }}
          INBOX_TOKEN: ${{ secrets.INBOX_TOKEN }}
        run: |
          git config user.name issueclaw-bot
          git config user.email issueclaw-bot@users.noreply.github.com
          issueclaw-inbox-replay
