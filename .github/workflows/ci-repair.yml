name: Scheduled CI repair coordinator
on:
  workflow_call:
    inputs:
      config:
        type: string
        required: true
      tooling-ref:
        type: string
        required: true
      dry-run:
        type: boolean
        default: true
      langsmith-workspace-id:
        type: string
        required: true
      handoff-role-arn:
        type: string
        default: ''
      handoff-bucket:
        type: string
        default: ''
      handoff-key:
        type: string
        default: ''
      handoff-public-base:
        type: string
        default: ''
    secrets:
      REPOS_READ_TOKEN:
        required: true
      CLAUDE_CODE_OAUTH_TOKEN:
        required: true
      LANGSMITH_API_KEY:
        required: true

permissions:
  contents: read
  actions: read

jobs:
  handoff:
    if: inputs.dry-run == false && inputs.handoff-role-arn != ''
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v6
        with:
          repository: aviadr1/issueclaw
          ref: ${{ inputs.tooling-ref }}
          persist-credentials: false
      - uses: actions/setup-python@v6
        with:
          python-version: '3.14'
      - run: pip install .
      - uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ inputs.handoff-role-arn }}
          aws-region: us-east-1
      - name: Publish only the static launcher page, never session contents
        env:
          HANDOFF_BUCKET: ${{ inputs.handoff-bucket }}
          HANDOFF_KEY: ${{ inputs.handoff-key }}
          HANDOFF_BASE: ${{ inputs.handoff-public-base }}
        run: |
          python - <<'PY'
          import json, os
          from pathlib import Path
          from issueclaw.s3_hosting import put
          url = put(Path('src/issueclaw/ci-handoff.html'), os.environ['HANDOFF_BUCKET'], os.environ['HANDOFF_KEY'], os.environ['HANDOFF_BASE'])
          Path('/tmp/handoff-site.json').write_text(json.dumps({'url': url}))
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: repair-handoff-receipt
          path: /tmp/handoff-site.json
          retention-days: 30

  image:
    needs: discover
    if: inputs.dry-run == false && needs.discover.outputs.count != '0'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    outputs:
      image: ${{ steps.reference.outputs.image }}
    steps:
      - uses: actions/checkout@v6
        with:
          repository: aviadr1/issueclaw
          ref: ${{ inputs.tooling-ref }}
          persist-credentials: false
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}
      - uses: docker/build-push-action@v6
        id: build
        with:
          context: .
          file: docker/ci-repair/Dockerfile
          push: true
          tags: ghcr.io/${{ github.repository }}/ci-repair-runner:${{ inputs.tooling-ref }}
          cache-from: type=gha,scope=ci-repair-runner
          cache-to: type=gha,scope=ci-repair-runner,mode=max
      - name: Pass the immutable image digest to workers
        id: reference
        env:
          DIGEST: ${{ steps.build.outputs.digest }}
        run: echo "image=ghcr.io/$GITHUB_REPOSITORY/ci-repair-runner@$DIGEST" >> "$GITHUB_OUTPUT"

  discover:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      actions: read
    outputs:
      matrix: ${{ steps.discover.outputs.matrix }}
      count: ${{ steps.discover.outputs.count }}
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: actions/checkout@v6
        with:
          repository: aviadr1/issueclaw
          ref: ${{ inputs.tooling-ref }}
          path: .repair-tools
          persist-credentials: false
      - uses: actions/setup-python@v6
        with:
          python-version: '3.14'
      - run: pip install ./.repair-tools
      - name: Discover failures and reserve assignments before agents start
        id: discover
        env:
          GH_TOKEN: ${{ secrets.REPOS_READ_TOKEN }}
          CONFIG: ${{ inputs.config }}
          DRY_RUN: ${{ inputs.dry-run }}
        run: |
          args=()
          if [[ "$DRY_RUN" == true ]]; then args+=(--dry-run); fi
          python -m issueclaw.ci_repair discover --config "$CONFIG" "${args[@]}"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: ci-repair-batch
          path: /tmp/ci-repair-batch.json
          retention-days: 30

  repair:
    needs: [discover, image]
    if: inputs.dry-run == false && needs.discover.outputs.count != '0'
    strategy:
      fail-fast: false
      max-parallel: 4
      matrix: ${{ fromJSON(needs.discover.outputs.matrix) }}
    uses: ./.github/workflows/ci-repair-worker.yml
    with:
      incident: ${{ matrix.id }}
      target-repository: ${{ matrix.repository }}
      target-sha: ${{ matrix.sha }}
      config: ${{ inputs.config }}
      tooling-ref: ${{ inputs.tooling-ref }}
      runner-image: ${{ needs.image.outputs.image }}
      langsmith-workspace-id: ${{ inputs.langsmith-workspace-id }}
    secrets: inherit

  receipts:
    needs: [discover, repair, handoff]
    if: always() && inputs.dry-run == false && needs.discover.result == 'success'
    runs-on: ubuntu-latest
    permissions:
      contents: write
      actions: read
    steps:
      - uses: actions/checkout@v6
        with:
          repository: aviadr1/issueclaw
          ref: ${{ inputs.tooling-ref }}
          persist-credentials: false
      - uses: actions/setup-python@v6
        with:
          python-version: '3.14'
      - run: pip install .
      - uses: actions/download-artifact@v5
        with:
          pattern: repair-*-receipt
          path: /tmp/receipts
      - name: Persist results for the morning briefing
        env:
          GH_TOKEN: ${{ github.token }}
        run: python -m issueclaw.ci_repair finalize --root /tmp/receipts
