name: Daily learning briefing (reusable)

on:
  workflow_call:
    inputs:
      config:
        type: string
        required: true
      tooling-ref:
        type: string
        required: true
      generation-runner:
        description: 'Runner label for report research and video rendering'
        type: string
        default: ubuntu-latest
      post-to-slack:
        type: boolean
        default: false
      cutoff:
        type: string
        default: ''
      run-early:
        description: 'Manual run through now; callers can exclude the replaced scheduled date'
        type: boolean
        default: false
      revision-notes:
        type: string
        default: ''
      evidence-run-id:
        type: string
        default: ''
      learning-videos-repository:
        description: 'Video kit repository (src/learnings/AGENT.md); empty disables lessons'
        type: string
        default: ''
      learning-videos-ref:
        description: 'Reviewed commit of the video kit'
        type: string
        default: ''
      ci-artifact-role-arn:
        description: 'Role the main branch assumes (OIDC) to host review media publicly by URL; empty disables hosting'
        type: string
        default: ''
      ci-artifact-region:
        type: string
        default: us-east-1
      ci-artifact-bucket:
        description: 'Public-by-URL CI artifact bucket (no listing)'
        type: string
        default: ''
      ci-artifact-prefix:
        description: "The caller's upload prefix, e.g. ci-artifacts/365d/<org>/<repo>"
        type: string
        default: ''
      ci-artifact-public-base:
        description: 'HTTPS base URL of the bucket'
        type: string
        default: ''
    secrets:
      REPOS_READ_TOKEN:
        required: true
      ANTHROPIC_API_KEY:
        required: true
      SLACK_BOT_TOKEN:
        required: true
      PR_COMMENT_TOKEN:
        description: 'PR-comment write access to configured source repos; falls back to REPOS_READ_TOKEN'
        required: false
      VIDEOS_READ_TOKEN:
        description: 'Read access to the video kit when REPOS_READ_TOKEN lacks it'
        required: false

permissions:
  contents: write
  actions: read

jobs:
  plan:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      enabled: ${{ steps.plan.outputs.enabled }}
      cutoff: ${{ steps.plan.outputs.cutoff }}
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: actions/checkout@v6
        with:
          repository: aviadr1/issueclaw
          ref: ${{ inputs.tooling-ref }}
          path: .briefing-tools
          persist-credentials: false
      - id: plan
        name: Resolve early cutoff or scheduled date exception
        env:
          BRIEFING_CONFIG: ${{ inputs.config }}
          BRIEFING_EARLY: ${{ inputs.run-early }}
          BRIEFING_CUTOFF: ${{ inputs.cutoff }}
          BRIEFING_EVIDENCE_RUN: ${{ inputs.evidence-run-id }}
        run: |
          args=()
          if [ "$BRIEFING_EARLY" = 'true' ]; then
            if [ -n "$BRIEFING_CUTOFF" ] || [ -n "$BRIEFING_EVIDENCE_RUN" ]; then
              echo 'An early run cannot reuse historical evidence or a historical cutoff' >&2
              exit 1
            fi
            args+=(--early)
          fi
          python .briefing-tools/src/issueclaw/briefing_schedule.py \
            --config "$BRIEFING_CONFIG" --event "$GITHUB_EVENT_NAME" \
            "${args[@]}" >> "$GITHUB_OUTPUT"

  generate:
    needs: plan
    if: ${{ needs.plan.outputs.enabled == 'true' }}
    runs-on: ${{ inputs.generation-runner }}
    timeout-minutes: 210
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/checkout@v6
        with:
          repository: aviadr1/issueclaw
          ref: ${{ inputs.tooling-ref }}
          path: .briefing-tools
          persist-credentials: false
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - uses: astral-sh/setup-uv@v6
      - uses: actions/setup-node@v6
        with:
          node-version: '22'
      - name: Install reporting tools
        run: |
          uv venv /tmp/briefing-venv
          uv pip install --python /tmp/briefing-venv/bin/python ./.briefing-tools
          npm install -g @anthropic-ai/claude-code
          sudo apt-get update -qq
          sudo apt-get install -y ffmpeg
      - name: Collect daily, review-history, ticket and CI evidence
        env:
          GH_TOKEN: ${{ secrets.REPOS_READ_TOKEN }}
          GITHUB_TOKEN: ${{ github.token }}
          BRIEFING_CONFIG: ${{ inputs.config }}
          BRIEFING_CUTOFF: ${{ needs.plan.outputs.cutoff || inputs.cutoff }}
          BRIEFING_EVIDENCE_RUN: ${{ inputs.evidence-run-id }}
          BRIEFING_PUBLISH: ${{ inputs.post-to-slack }}
        run: |
          args=()
          if [ -n "$BRIEFING_CUTOFF" ]; then args+=(--cutoff "$BRIEFING_CUTOFF"); fi
          if [ "$BRIEFING_PUBLISH" != 'true' ]; then args+=(--isolated); fi
          if [ -n "$BRIEFING_EVIDENCE_RUN" ]; then args+=(--evidence-run-id "$BRIEFING_EVIDENCE_RUN"); fi
          /tmp/briefing-venv/bin/python -m issueclaw.daily_briefing prepare \
            --config "$BRIEFING_CONFIG" --out /tmp/daily-briefing "${args[@]}"
      - name: Record reproducible runner and source versions
        env:
          TOOLING_REF: ${{ inputs.tooling-ref }}
          VIDEO_KIT_REF: ${{ inputs.learning-videos-ref }}
          BRIEFING_CONFIG: ${{ inputs.config }}
          EVIDENCE_RUN_ID: ${{ inputs.evidence-run-id }}
        run: |
          python - <<'PY'
          import json, os, pathlib, subprocess
          out = pathlib.Path('/tmp/daily-briefing')
          versions = {key: os.environ[key] for key in ('TOOLING_REF', 'VIDEO_KIT_REF', 'GITHUB_RUN_ID', 'GITHUB_RUN_ATTEMPT', 'GITHUB_SHA', 'EVIDENCE_RUN_ID')}
          versions['claude'] = subprocess.check_output(['claude', '--version'], text=True).strip()
          versions['node'] = subprocess.check_output(['node', '--version'], text=True).strip()
          versions['cpu_count'] = os.cpu_count()
          versions['runner_name'] = os.environ.get('RUNNER_NAME')
          attempt = f"{os.environ['GITHUB_RUN_ID']}-{os.environ['GITHUB_RUN_ATTEMPT']}"
          (out / f'runner-{attempt}.json').write_text(json.dumps(versions, indent=2))
          (out / f'config-{attempt}.json').write_text(pathlib.Path(os.environ['BRIEFING_CONFIG']).read_text())
          PY
      - name: Write and revise learning briefing
        env:
          BRIEFING_REVISION_NOTES: ${{ inputs.revision-notes }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          BRIEFING_CONFIG: ${{ inputs.config }}
        run: |
          /tmp/briefing-venv/bin/python -m issueclaw.daily_briefing generate \
            --config "$BRIEFING_CONFIG" --out /tmp/daily-briefing \
            --prompt .briefing-tools/src/issueclaw/prompts/daily-learning-briefing.md \
            --revision-notes "$BRIEFING_REVISION_NOTES"
      - name: Preserve selection and model trace before rendering
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: daily-learning-selection
          path: |
            /tmp/daily-briefing/report.md
            /tmp/daily-briefing/*selection*.json
            /tmp/daily-briefing/generation*
            /tmp/daily-briefing/revision*
            /tmp/daily-briefing/runner-*.json
          retention-days: 90
          if-no-files-found: warn
      - name: Check out the learning video kit
        if: ${{ inputs.learning-videos-repository != '' && inputs.learning-videos-ref != '' }}
        continue-on-error: true
        uses: actions/checkout@v6
        with:
          repository: ${{ inputs.learning-videos-repository }}
          ref: ${{ inputs.learning-videos-ref }}
          path: .learning-videos
          token: ${{ secrets.VIDEOS_READ_TOKEN || secrets.REPOS_READ_TOKEN }}
          persist-credentials: false
      - name: Research and render the lesson plus PR review walkthrough (Sonnet with Opus advisor)
        # Optional and fail-soft: the briefing publishes without lessons on failure.
        if: ${{ inputs.learning-videos-repository != '' && inputs.learning-videos-ref != '' }}
        continue-on-error: true
        timeout-minutes: 150
        env:
          GH_TOKEN: ${{ secrets.REPOS_READ_TOKEN }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          BRIEFING_CONFIG: ${{ inputs.config }}
        run: |
          test -f .learning-videos/src/learnings/AGENT.md
          (cd .learning-videos && npm ci --no-audit --no-fund && npx remotion browser ensure)
          /tmp/briefing-venv/bin/python -m issueclaw.daily_briefing learn             --config "$BRIEFING_CONFIG" --out /tmp/daily-briefing             --prompt .briefing-tools/src/issueclaw/prompts/learning-video.md             --videos-dir .learning-videos
      - name: Preserve work-in-progress video source after interruption
        if: always()
        run: |
          python - <<'PY'
          import runpy
          from pathlib import Path
          trace = runpy.run_path('.briefing-tools/src/issueclaw/briefing_trace.py')
          trace['preserve_source'](Path('.learning-videos'), Path('/tmp/daily-briefing/video-kit'))
          trace['write_index'](Path('/tmp/daily-briefing'))
          PY
      - name: Validate message and inventory coverage
        env:
          GITHUB_TOKEN: ${{ github.token }}
          BRIEFING_CONFIG: ${{ inputs.config }}
        run: |
          /tmp/briefing-venv/bin/python -m issueclaw.daily_briefing validate \
            --config "$BRIEFING_CONFIG" --out /tmp/daily-briefing
          if [ -f /tmp/daily-briefing/messages/01-toplevel.md ]; then
            test -s /tmp/daily-briefing/coverage.md
            cat /tmp/daily-briefing/messages/01-toplevel.md >> "$GITHUB_STEP_SUMMARY"
          fi
      - name: Preserve evidence, coverage and messages
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: daily-learning-briefing
          path: /tmp/daily-briefing/
          retention-days: 90
          if-no-files-found: error

  host-media:
    # Its own job, so the only steps that can mint the upload credentials are these:
    # the agent's job never gets id-token, and this one treats the artifact as data.
    needs: [plan, generate]
    if: ${{ !cancelled() && needs.generate.result == 'success' && inputs.ci-artifact-role-arn != '' && github.ref == 'refs/heads/main' }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    continue-on-error: true
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v6
        with:
          repository: aviadr1/issueclaw
          ref: ${{ inputs.tooling-ref }}
          path: .briefing-tools
          persist-credentials: false
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - uses: astral-sh/setup-uv@v6
      - uses: actions/download-artifact@v6
        with:
          name: daily-learning-briefing
          path: /tmp/daily-briefing/
      - name: Assume the repository's CI artifact upload role
        uses: aws-actions/configure-aws-credentials@cabfdba3510de1431bac9dba27511d97497fc100 # v5
        with:
          role-to-assume: ${{ inputs.ci-artifact-role-arn }}
          aws-region: ${{ inputs.ci-artifact-region }}
          role-session-name: daily-briefing-${{ github.run_id }}
      - name: Host each video's review media
        env:
          ARTIFACT_BUCKET: ${{ inputs.ci-artifact-bucket }}
          ARTIFACT_PREFIX: ${{ inputs.ci-artifact-prefix }}
          ARTIFACT_PUBLIC_BASE: ${{ inputs.ci-artifact-public-base }}
        run: |
          uv venv /tmp/briefing-venv
          uv pip install --python /tmp/briefing-venv/bin/python ./.briefing-tools
          index=$(/tmp/briefing-venv/bin/python -m issueclaw.daily_briefing host-media \
            --out /tmp/daily-briefing \
            --bucket "$ARTIFACT_BUCKET" --prefix "$ARTIFACT_PREFIX" \
            --public-base "$ARTIFACT_PUBLIC_BASE")
          echo "Review media: $index" >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v6
        with:
          name: daily-learning-media
          path: |
            /tmp/daily-briefing/hosted-media.json
            /tmp/daily-briefing/hosted-media.html
          retention-days: 90
          if-no-files-found: warn

  publish:
    needs: [plan, generate, host-media]
    # Hosting is optional: publish whether it succeeded, failed or was skipped.
    if: ${{ !cancelled() && inputs.post-to-slack && needs.generate.result == 'success' }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: actions/checkout@v6
        with:
          repository: aviadr1/issueclaw
          ref: ${{ inputs.tooling-ref }}
          path: .briefing-tools
          persist-credentials: false
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - uses: astral-sh/setup-uv@v6
      - uses: actions/download-artifact@v6
        with:
          name: daily-learning-briefing
          path: /tmp/daily-briefing/
      - name: Use the hosted review media, when there is any
        continue-on-error: true
        uses: actions/download-artifact@v6
        with:
          name: daily-learning-media
          path: /tmp/daily-briefing/
      - name: Publish or resume Slack thread
        env:
          GITHUB_TOKEN: ${{ github.token }}
          SLACK_BOT_TOKEN: ${{ secrets.SLACK_BOT_TOKEN }}
          BRIEFING_CONFIG: ${{ inputs.config }}
        run: |
          uv venv /tmp/briefing-venv
          uv pip install --python /tmp/briefing-venv/bin/python ./.briefing-tools
          /tmp/briefing-venv/bin/python -m issueclaw.daily_briefing publish \
            --config "$BRIEFING_CONFIG" --out /tmp/daily-briefing
      - name: Use a GitHub CLI that can attach video to PR comments (2.99+)
        run: |
          set -euo pipefail
          have=$(gh --version | head -1 | awk '{print $3}')
          if printf '%s\n%s\n' 2.99.0 "$have" | sort -V -C; then
            echo "gh $have can attach video"
            exit 0
          fi
          v=2.102.0
          curl -fsSLo /tmp/gh.tgz "https://github.com/cli/cli/releases/download/v$v/gh_${v}_linux_amd64.tar.gz"
          echo "bb766f710eef8ede859c18578c72c327597cd4c8a85b06001b1f3843c6019386  /tmp/gh.tgz" | sha256sum -c -
          tar -xzf /tmp/gh.tgz -C /tmp
          echo "/tmp/gh_${v}_linux_amd64/bin" >> "$GITHUB_PATH"
      - name: Attach published videos to their source PRs
        env:
          GITHUB_TOKEN: ${{ github.token }}
          GH_TOKEN: ${{ secrets.PR_COMMENT_TOKEN || secrets.REPOS_READ_TOKEN }}
          BRIEFING_CONFIG: ${{ inputs.config }}
        run: |
          /tmp/briefing-venv/bin/python -m issueclaw.daily_briefing attach-pr-videos \
            --config "$BRIEFING_CONFIG" --out /tmp/daily-briefing
      - name: Preserve publication and PR attachment receipts
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: daily-learning-briefing-delivery
          path: |
            /tmp/daily-briefing/*state.json
            /tmp/daily-briefing/pr-video-delivery.json
          retention-days: 90
          if-no-files-found: warn
